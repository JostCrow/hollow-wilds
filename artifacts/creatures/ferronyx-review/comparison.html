<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ferronyx model comparison</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font-sans,system-ui);color:var(--foreground,#dbe4e4)}
.comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}
figcaption{font-size:12px;color:var(--muted-foreground,#9aa9ad);margin-bottom:9px}
.stage{background:#202729;border-radius:var(--radius,12px);padding:16px;position:relative}
.stage img{display:block;width:100%;height:340px;object-fit:contain}.stage img[hidden]{display:none}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0;align-items:center}
button{border:1px solid var(--border,#465253);border-radius:6px;background:transparent;color:inherit;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}
button[aria-pressed=true]{background:var(--primary,#c5d8d4);color:var(--primary-foreground,#172124);border-color:transparent}
button:focus-visible{outline:2px solid var(--ring,#95c4ba);outline-offset:3px}
.note{font-size:12px;color:var(--muted-foreground,#9aa9ad);margin:12px 0 0}
@media(max-width:520px){.comparison{gap:10px}.stage{padding:16px}.stage img{height:230px}.controls{gap:5px}button{padding:5px 8px}}
</style>
<div class="comparison">
  <figure><figcaption>Original reference</figcaption><div class="stage"><img src="/Users/jorik/github/pokemon-browser/assets/monster/ferronyx.png" alt="Ferronyx original illustration: a steel wolf with layered gear armor"></div></figure>
  <figure><figcaption id="view-label">Rebuilt model · three-quarter view</figcaption><div class="stage">
    <img data-view="hero" src="/Users/jorik/github/pokemon-browser/artifacts/creatures/ferronyx-review/hero.png" alt="Rebuilt Ferronyx model, three-quarter view">
    <img data-view="side" src="/Users/jorik/github/pokemon-browser/artifacts/creatures/ferronyx-review/side.png" alt="Rebuilt Ferronyx model, side view" hidden>
    <img data-view="front" src="/Users/jorik/github/pokemon-browser/artifacts/creatures/ferronyx-review/front.png" alt="Rebuilt Ferronyx model, front view" hidden>
    <img data-view="rear" src="/Users/jorik/github/pokemon-browser/artifacts/creatures/ferronyx-review/rear.png" alt="Rebuilt Ferronyx model, rear view" hidden>
    <img data-view="before" src="/Users/jorik/github/pokemon-browser/artifacts/creatures/ferronyx-review/before.png" alt="The previous smooth wolf model" hidden>
  </div></figure>
</div>
<div class="controls" aria-label="Model review angles">
  <button data-select="hero" aria-pressed="true">Three-quarter</button>
  <button data-select="side" aria-pressed="false">Side</button>
  <button data-select="front" aria-pressed="false">Front</button>
  <button data-select="rear" aria-pressed="false">Rear</button>
  <button data-select="before" aria-pressed="false">Previous model</button>
</div>
<p class="note">Built from scratch: open cog assemblies, layered steel armor, a snarling jaw with individual fangs, articulated limbs, hooked talons, and a segmented blade tail.</p>
<script>
const labels={hero:'Rebuilt model · three-quarter view',side:'Rebuilt model · side view',front:'Rebuilt model · front view',rear:'Rebuilt model · rear view',before:'Previous model'};
document.querySelectorAll('[data-select]').forEach(button=>button.addEventListener('click',()=>{
 const view=button.dataset.select;
 document.querySelectorAll('[data-view]').forEach(img=>img.hidden=img.dataset.view!==view);
 document.querySelectorAll('[data-select]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 document.getElementById('view-label').textContent=labels[view];
}));
</script>
</html>
